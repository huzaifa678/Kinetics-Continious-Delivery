{{- if eq (include "kinetics-training.gpuMode" .) "dra" }}
---
# Option B (DRA) ONLY — rendered when gpu.mode == "dra". Declares how many GPUs
# each training pod claims. The pod template references this by name via
# spec.resourceClaims (hyperpod-pytorchjob.yaml); the HyperPod operator stamps
# the pod out per replica, and the scheduler + NVIDIA DRA driver allocate a
# fresh ResourceClaim (gpusPerNode devices) per pod.
#
# API version: resource.k8s.io/v1 is GA and served on EKS 1.34 (the cluster
# target). On 1.32/1.33 use resource.k8s.io/v1beta1, whose request schema is
# flatter (deviceClassName + count + allocationMode directly under the request,
# no `exactly` wrapper). Confirm the served version and shape before enabling:
#   kubectl explain resourceclaimtemplate.spec.spec.devices.requests
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ include "kinetics-training.fullname" . }}-gpu
  labels:
    {{- include "kinetics-training.labels" . | nindent 4 }}
spec:
  spec:
    devices:
      requests:
        - name: gpus
          exactly:
            # DeviceClass shipped by the NVIDIA DRA driver chart.
            deviceClassName: {{ .Values.gpu.dra.deviceClassName }}
            # One whole GPU per rank — same count as the Option A
            # nvidia.com/gpu limit, derived from the one knob.
            allocationMode: ExactCount
            count: {{ .Values.distributed.gpusPerNode }}
{{- end }}
