image:
  repository: 533267178572.dkr.ecr.us-east-1.amazonaws.com/kinetics-training
  tag: sha-latest
  pullPolicy: Always      # moving tag (sha-latest) → always pull the current build

# Namespace where both the ServiceAccount and WorkflowTemplate live.
# Must match the Argo Workflows controller namespace (default: argo).
namespace: argo

numShards: 64
parallelism: 8
backoffLimit: 2

# Input manifest (on the FSx /data mount) + decode params.
manifest: /data/kinetics400/train.csv
clipLength: 16
resize: 256

# Output WebDataset shards. S3 so training can stream them (FSx can also import).
outputS3: s3://kinetics-pipeline-dev-data-533267178572/kinetics400/shards/train

# Dataset input via the same FSx-for-Lustre PVC the training job uses.
data:
  fsxClaimName: fsx-lustre-pvc
  mountPath: /data

# CPU-only decode — keep it OFF the GPU nodes (no GPU toleration).
resources:
  requests:
    cpu: "4"
    memory: 8Gi
  limits:
    cpu: "8"
    memory: 16Gi

nodeSelector: {}
tolerations: []

serviceAccount:
  create: true
  name: etl-shards
  # No IRSA annotation. AWS credentials are supplied by the EKS Pod Identity Agent
  # (DaemonSet in kube-system). Terraform creates the association:
  #   aws_eks_pod_identity_association.etl_shards  →  role kinetics-{env}-etl-shards
  # The agent injects credentials automatically for pods running as this SA.
  # No eks.amazonaws.com/role-arn annotation is needed or used.
  annotations: {}
