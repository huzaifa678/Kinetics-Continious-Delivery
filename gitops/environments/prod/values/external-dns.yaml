---
provider:
  name: aws
# Watch Services AND Ingresses — the ArgoCD Ingress (ingressClassName: nginx)
# publishes the internal NLB hostname in its status; external-dns turns that into
# the argocd.freeeasycrypto.com record.
sources:
  - service
  - ingress
policy: upsert-only
registry: txt
txtOwnerId: kinetics-pipeline-prod
serviceAccount:
  create: true
  name: external-dns
env:
  - name: AWS_REGION
    value: us-east-1
# domainFilters:
#   - inference.example.com
