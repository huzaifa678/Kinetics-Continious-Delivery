---
# AMP remote_write endpoint comes from the GitOps contract (terraform
# module.observability). Layered OVER environments/<env>/values/kube-prometheus-stack.yaml
# by the kinetics-platform ApplicationSet, so it can never drift from the
# workspace terraform actually created.
prometheus:
  prometheusSpec:
    remoteWrite:
      - url: "${amp_remote_write_url}"
        sigv4:
          region: "${region}"
      # MIGRATION: second target = in-cluster Thanos Receive (durable long-term
      # store on S3, the successor to AMP — see gitops/observability/thanos).
      # Prometheus ships to BOTH during the cutover. Once Thanos is verified
      # Synced+Healthy and queryable, delete the AMP target above (and flip
      # enable_managed_prometheus=false in terraform) to finish the replacement.
      - url: http://thanos-receive.thanos.svc.cluster.local:19291/api/v1/receive
