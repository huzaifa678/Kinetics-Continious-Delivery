{{- if .Values.receive.enabled }}
{{- $name := include "thanos.name" . }}
---
# Headless Service — enables dnssrv+_grpc._tcp.thanos-receive discovery by Query,
# and is the remote-write target for Prometheus (thanos-receive:19291).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-receive
  labels: {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: receive
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: receive
  ports:
    - {name: grpc, port: {{ .Values.ports.grpc }}, targetPort: grpc}
    - {name: http, port: {{ .Values.ports.http }}, targetPort: http}
    - {name: remote-write, port: {{ .Values.ports.remoteWrite }}, targetPort: remote-write}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-receive
  labels: {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: receive
spec:
  replicas: {{ .Values.receive.replicaCount }}
  serviceName: {{ $name }}-receive
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: receive
    spec:
      serviceAccountName: {{ .Values.receive.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: receive
          image: {{ include "thanos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - receive
            - --grpc-address=0.0.0.0:{{ .Values.ports.grpc }}
            - --http-address=0.0.0.0:{{ .Values.ports.http }}
            - --remote-write.address=0.0.0.0:{{ .Values.ports.remoteWrite }}
            - --objstore.config-file=/etc/thanos/objstore.yaml
            - --tsdb.path=/var/thanos/receive
            - --tsdb.retention={{ .Values.receive.tsdbRetention }}
            - --label=receive_replica="$(POD_NAME)"
            - --receive.local-endpoint=127.0.0.1:{{ .Values.ports.grpc }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: grpc, containerPort: {{ .Values.ports.grpc }}}
            - {name: http, containerPort: {{ .Values.ports.http }}}
            - {name: remote-write, containerPort: {{ .Values.ports.remoteWrite }}}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: objstore, mountPath: /etc/thanos, readOnly: true}
            - {name: data, mountPath: /var/thanos/receive}
      volumes:
        - name: objstore
          secret: {secretName: {{ $name }}-objstore}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.receive.persistence.size }}
{{- end }}
