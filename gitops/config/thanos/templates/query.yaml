{{- if .Values.query.enabled }}
{{- $name := include "thanos.name" . }}
---
# Query — stateless fan-out read layer. Service port 9090 is the Grafana
# datasource target (http://thanos-query.thanos.svc.cluster.local:9090).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-query
  labels: {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: query
  ports:
    - {name: http, port: {{ .Values.ports.query }}, targetPort: http}
    - {name: grpc, port: {{ .Values.ports.grpc }}, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-query
  labels: {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  replicas: {{ .Values.query.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: query
    spec:
      serviceAccountName: {{ .Values.query.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: query
          image: {{ include "thanos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - query
            - --grpc-address=0.0.0.0:{{ .Values.ports.grpc }}
            - --http-address=0.0.0.0:{{ .Values.ports.query }}
            # Dedupe the per-replica label Receive adds.
            - --query.replica-label=receive_replica
            {{- range .Values.query.stores }}
            - --endpoint={{ . }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.ports.query }}}
            - {name: grpc, containerPort: {{ .Values.ports.grpc }}}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
{{- end }}
