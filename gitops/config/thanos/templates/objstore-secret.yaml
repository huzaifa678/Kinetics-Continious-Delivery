---
# S3 objstore config consumed by receive / storegateway / compactor via
# --objstore.config-file. Value comes from the generated contract overlay.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thanos.name" . }}-objstore
  labels: {{- include "thanos.labels" . | nindent 4 }}
type: Opaque
stringData:
  objstore.yaml: |-
{{ .Values.objstoreConfig | default "" | indent 4 }}
