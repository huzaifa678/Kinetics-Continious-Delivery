---
image:
  # Set by CI (update-gitops.yml) to the shared ECR repo. Placeholder until the
  # first prod docker-build dispatch writes the real repo/tag.
  repository: 533267178572.dkr.ecr.us-east-1.amazonaws.com/kinetics-training
  tag: backstage-e478a47
  pullPolicy: IfNotPresent
replicaCount: 1
host: backstage.freeeasycrypto.com
# ArgoCD instance the Argo CD plugin queries. In-cluster over the VPN host.
argocdUrl: https://argocd.freeeasycrypto.com
serviceAccount:
  name: backstage
service:
  port: 7007
# Internal ingress-nginx + cert-manager (letsencrypt-dns ClusterIssuer), exactly
# like the ArgoCD UI: nginx terminates TLS, external-dns registers the host to
# the internal NLB → reachable only over the Client VPN.
ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-dns
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# External Secrets Operator wiring. The ClusterSecretStore `aws-secrets` already
# exists (gitops/config/external-secrets). These pull from Secrets Manager:
#   db     -> kinetics-backstage-db-<env>   (terraform: modules/rds)
#   oidc   -> kinetics-backstage-oidc-<env> (terraform: cognito client secret)
#   app    -> kinetics-backstage-app-<env>  (OUT-OF-BAND: github/argocd tokens + backend secret)
externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets
  refreshInterval: 1h
  dbRemoteKey: kinetics-backstage-db-prod
  oidcRemoteKey: kinetics-backstage-oidc-prod
  appRemoteKey: kinetics-backstage-app-prod
