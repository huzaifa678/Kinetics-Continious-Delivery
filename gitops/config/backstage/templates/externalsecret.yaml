{{- if .Values.externalSecrets.enabled }}
---
# Postgres connection (RDS) — synced from kinetics-backstage-db-<env>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-db
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: backstage-db
    creationPolicy: Owner
  data:
    - {secretKey: host, remoteRef: {key: {{ .Values.externalSecrets.dbRemoteKey }}, property: host}}
    - {secretKey: port, remoteRef: {key: {{ .Values.externalSecrets.dbRemoteKey }}, property: port}}
    - {secretKey: username, remoteRef: {key: {{ .Values.externalSecrets.dbRemoteKey }}, property: username}}
    - {secretKey: password, remoteRef: {key: {{ .Values.externalSecrets.dbRemoteKey }}, property: password}}
    - {secretKey: database, remoteRef: {key: {{ .Values.externalSecrets.dbRemoteKey }}, property: database}}
---
# App secrets — Cognito OIDC (terraform) + GitHub/ArgoCD tokens + backend signing
# key (the *-app-<env> secret is populated OUT-OF-BAND, like the runner PAT).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: backstage-secrets
    creationPolicy: Owner
  data:
    - {secretKey: clientId, remoteRef: {key: {{ .Values.externalSecrets.oidcRemoteKey }}, property: clientId}}
    - {secretKey: clientSecret, remoteRef: {key: {{ .Values.externalSecrets.oidcRemoteKey }}, property: clientSecret}}
    - {secretKey: metadataUrl, remoteRef: {key: {{ .Values.externalSecrets.oidcRemoteKey }}, property: metadataUrl}}
    - {secretKey: githubToken, remoteRef: {key: {{ .Values.externalSecrets.appRemoteKey }}, property: githubToken}}
    - {secretKey: argocdToken, remoteRef: {key: {{ .Values.externalSecrets.appRemoteKey }}, property: argocdToken}}
    - {secretKey: backendSecret, remoteRef: {key: {{ .Values.externalSecrets.appRemoteKey }}, property: backendSecret}}
{{- end }}
