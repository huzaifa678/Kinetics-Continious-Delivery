---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        # The image's USER is the name `node` (node:20-slim), which kubelet can't
        # verify as non-root under runAsNonRoot -> "image has non-numeric user".
        # Pin the numeric uid/gid of that `node` user (1000) so admission passes.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "packages/backend"]
          args:
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.production.yaml"
          ports:
            - name: http
              containerPort: 7007
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # Non-secret runtime config.
            - name: BACKSTAGE_HOST
              value: {{ .Values.host | quote }}
            - name: ARGOCD_URL
              value: {{ .Values.argocdUrl | quote }}
            # Postgres (RDS) — from the ESO-synced backstage-db Secret.
            - name: POSTGRES_HOST
              valueFrom: {secretKeyRef: {name: backstage-db, key: host}}
            - name: POSTGRES_PORT
              valueFrom: {secretKeyRef: {name: backstage-db, key: port}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: backstage-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: backstage-db, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: backstage-db, key: database}}
            # Cognito OIDC + integration tokens — from backstage-secrets.
            - name: COGNITO_METADATA_URL
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: metadataUrl}}
            - name: COGNITO_CLIENT_ID
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: clientId}}
            - name: COGNITO_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: clientSecret}}
            - name: GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: githubToken}}
            - name: ARGOCD_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: argocdToken}}
            - name: BACKEND_SECRET
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: backendSecret}}
            # reuse backendSecret as the session cookie signing key.
            - name: APP_CONFIG_auth_session_secret
              valueFrom: {secretKeyRef: {name: backstage-secrets, key: backendSecret}}
            - name: APP_CONFIG_catalog_locations
              value: |
                [{"type":"file","target":"./catalog/all.yaml","rules":[{"allow":["Component","System","API","Resource","Location","Group","User","Domain"]}]},{"type":"file","target":"./catalog/templates/register-existing/template.yaml","rules":[{"allow":["Template"]}]},{"type":"file","target":"./catalog/templates/training-job/template.yaml","rules":[{"allow":["Template"]}]}]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
        - name: kubectl-proxy
          image: registry.k8s.io/kubectl:v1.34.0
          command: ["kubectl"]
          args:
            - proxy
            - --port=8001
            - --address=127.0.0.1
            - --accept-hosts=.*
          ports:
            - name: kube-proxy
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            # kubectl writes a discovery cache under $HOME; leave rootfs writable.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /api, port: kube-proxy }
            initialDelaySeconds: 15
            periodSeconds: 20
