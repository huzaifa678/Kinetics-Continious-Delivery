{{- if .Values.ingress.enabled }}
---
# Internal ingress-nginx + cert-manager TLS — identical pattern to the ArgoCD UI.
# nginx terminates TLS with a cert minted by the `letsencrypt-dns` ClusterIssuer;
# external-dns reads the published internal-NLB hostname from this Ingress's
# status and creates the {{ .Values.host }} A-record → VPN-only reachable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: backstage-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: {{ .Values.service.port }}
{{- end }}
