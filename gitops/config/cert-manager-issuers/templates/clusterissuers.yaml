{{- range $key, $issuer := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer.name }}
spec:
  acme:
    server: {{ $issuer.server }}
    email: {{ $.Values.email }}
    privateKeySecretRef:
      name: {{ $issuer.name }}-account-key
    solvers:
      - dns01:
          route53:
            region: {{ $.Values.region }}
            {{- if $.Values.hostedZoneID }}
            hostedZoneID: {{ $.Values.hostedZoneID }}
            {{- end }}
{{- end }}
